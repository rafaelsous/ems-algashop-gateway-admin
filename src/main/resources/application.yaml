server.port: 9998

spring:
  application:
    name: gateway-admin
  data:
    redis:
      host: algashop-redis
      port: 6379
      password: algashop
      database: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.algashop.local:8081
  cloud:
    gateway:
      server:
        webflux:
          route-refresh-listener:
            enabled: false
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                methods: GET,PUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 20ms
          httpclient:
            connect-timeout: 1000
            response-timeout: 5000
          globalcors:
            cors-configurations:
                '[/**]':
                    allowed-origins:
                      -  http://admin.algashop.local:4200
                    allowed-methods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                    allowed-headers:
                      -  '*'
            add-to-simple-url-handler-mapping: true
          routes:
            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/upload-requests/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                - LocalResponseCache=5m,30MB
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 200
                      requestedTokens: 1
                    key-resolver: "#{@rateLimitKeyResolver}"

            - id: customers-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/customers/**
                - Method=GET,OPTIONS

            - id: orders-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/orders/**
                - Method=GET,OPTIONS

            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

eureka:
  client:
    service-url:
        defaultZone: http://algashop-service-registry:8761/eureka
    register-with-eureka: false
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, circuitbreakers
  endpoint:
    gateway:
      access: read_only

resilience4j.circuitbreaker:
  instances:
    ordering-route-cb:
      slidingWindowSize: 8
      failureRateThreshold: 50
      minimumNumberOfCalls: 4
      permittedNumberOfCallsInHalfOpenState: 3
      slidingWindowType: COUNT_BASED
      waitDurationInOpenState: 15s
      maxWaitDurationInHalfOpenState: 10s
      registerHealthIndicator: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG