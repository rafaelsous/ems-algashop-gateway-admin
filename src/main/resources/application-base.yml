server.port: 9998

spring:
  application:
    name: gateway-admin
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-catalog-list-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products
                - Method=GET
              filters:
                - RemoveJsonAttributesResponseBody=shortDescription,mainImage,true

            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/categories/**,/api/v1/upload-requests/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                #                - LocalResponseCache=5m,30MB
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 200
                      requestedTokens: 1
                    key-resolver: "#{@rateLimitKeyResolver}"

            - id: customers-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/customers/**
                - Method=GET,OPTIONS

            - id: orders-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/orders/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                - name: CircuitBreaker
                  args:
                    name: ordering-route-cb
                    statusCodes:
                      - 502
                      - 504
                      - 500

            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

            - id: emails-route
              uri: lb://notifications
              predicates:
                - Path=/api/v1/emails/**
                - Method=POST,OPTIONS

            - id: email-templates-route
              uri: lb://notifications
              predicates:
                - Path=/api/v1/email-templates/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

management:
  info:
    env.enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 60s
  circuitbreaker:
    instances:
      ordering-route-cb:
        slidingWindowSize: 8
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 5
        slidingWindowType: COUNT_BASED
        waitDurationInOpenState: 10s
        maxWaitDurationInHalfOpenState: 30s
        registerHealthIndicator: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG

info:
  app.name: AlgaShop Gateway Admin