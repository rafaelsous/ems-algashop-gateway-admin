spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/gateway-admin/redis-password?prefix=gateway-admin.secrets.
      - aws-parameterstore:/config/algashop/gateway-admin?prefix=gateway-admin.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
    gateway:
      server:
        webflux:
          route-refresh-listener:
            enabled: false
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                methods: GET,PUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 20ms
          httpclient:
            connect-timeout: ${gateway-admin.params.httpclient.connect-timeout}
            response-timeout: ${gateway-admin.params.httpclient.response-timeout}
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${gateway-admin.params.cors.allowed-origins}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  -  '*'
            add-to-simple-url-handler-mapping: true

  data:
    redis:
      host: ${gateway-admin.params.redis.host}
      port: ${gateway-admin.params.redis.port}
      password: ${gateway-admin.secrets.redis-password}
      database: ${gateway-admin.params.redis.database}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url}

eureka:
  client:
    service-url:
      defaultZone: ${shared.params.service-registry-url}/eureka
    register-with-eureka: false
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, circuitbreakers
  endpoint:
    gateway:
      access: read_only